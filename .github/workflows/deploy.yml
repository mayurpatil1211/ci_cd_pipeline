name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ -v \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=80

  deploy:
    runs-on: self-hosted
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag
      run: echo "IMAGE_TAG=myapp:${{ github.sha }}" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build \
          -t $IMAGE_TAG \
          -t myapp:latest \
          .

    - name: Load image into Minikube
      run: minikube image load $IMAGE_TAG

    - name: Update image tag in deployment manifest
      run: |
        sed -i "s|image: myapp:.*|image: $IMAGE_TAG|g" kubernetes/deployment.yaml

    - name: Apply Service # applied first — stable, rarely changes
      run: |
        kubectl apply -f kubernetes/service.yaml

    - name: Apply Deployment # applied second — changes on every deploy
      run: |
        kubectl apply -f kubernetes/deployment.yaml
        kubectl rollout status deployment/myapp --timeout=120s

    - name: Smoke test
      run: |
        MINIKUBE_IP=$(minikube ip)
        NODE_PORT=$(kubectl get svc myapp-svc -o jsonpath='{.spec.ports[0].nodePort}')
        curl -f http://$MINIKUBE_IP:$NODE_PORT/health
        echo "Smoke test passed!"

    - name: Rollback on failure
      if: failure()
      run: kubectl rollout undo deployment/myapp
