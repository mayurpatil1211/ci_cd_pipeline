name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ] # also run tests on PRs, but don't deploy

jobs:
  # ── Job 1: Test ─────────────────────────────────────────────
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests with coverage
      run: |
        pytest tests/ -v \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=80      # fail if coverage drops below 80%

  # ── Job 2: Deploy (only runs if test passes, only on main) ──
  deploy:
    runs-on: self-hosted
    needs: test # blocks until test job is green
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set image tag
      run: echo "IMAGE_TAG=myapp:${{ github.sha }}" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build \
          --build-arg VERSION=${{ github.sha }} \
          -t $IMAGE_TAG \
          -t myapp:latest \
          .

    - name: Load image into Minikube
      run: minikube image load $IMAGE_TAG

    - name: Update image tag in manifest
      run: |
        sed -i "s|image: myapp:.*|image: $IMAGE_TAG|g" kubernetes/deployment.yaml

    - name: Apply to Kubernetes
      run: |
        kubectl apply -f kubernetes/deployment.yaml
        kubectl rollout status deployment/myapp --timeout=120s

    - name: Smoke test the live deployment
      run: |
        MINIKUBE_IP=$(minikube ip)
        NODE_PORT=$(kubectl get svc myapp-svc -o jsonpath='{.spec.ports[0].nodePort}')
        curl -f http://$MINIKUBE_IP:$NODE_PORT/health
        echo "Smoke test passed!"

    - name: Rollback on failure
      if: failure()
      run: kubectl rollout undo deployment/myapp
