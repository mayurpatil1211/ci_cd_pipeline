name: Test and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

jobs:
  test:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        # no cache: "pip" — using actions/cache below instead

    - name: Cache pip dependencies
      id: pip-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-3.12-${{ hashFiles('requirements*.txt') }}
        # ↑ fixed: hardcoded 3.12, no matrix variable
        restore-keys: |
          pip-3.12-

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Lint with flake8
      run: |
        flake8 app/ \
          --max-line-length=100 \
          --exclude=__pycache__ \
          --statistics

    - name: Run tests with coverage
      run: |
        pytest tests/ -v \
          --cov=app \
          --cov-report=term-missing \
          --cov-fail-under=80

  deploy:
    runs-on: self-hosted
    needs: test
    # ↑ fixed: added workflow_dispatch to condition
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set target namespace
      # ↑ fixed: this step was missing entirely
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          NAMESPACE="${{ github.event.inputs.environment }}"
        else
          NAMESPACE="staging"
        fi
        echo "NAMESPACE=$NAMESPACE" >> $GITHUB_ENV
        echo "Target namespace: $NAMESPACE"

    - name: Show deployment info
      run: |
        echo "Namespace   : $NAMESPACE"
        echo "Triggered by: ${{ github.event_name }}"
        echo "Commit      : ${{ github.sha }}"
        echo "Actor       : ${{ github.actor }}"

    - name: Set image tag
      run: echo "IMAGE_TAG=myapp:${{ github.sha }}" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        docker build \
          -t $IMAGE_TAG \
          -t myapp:latest \
          .

    - name: Load image into Minikube
      run: minikube image load $IMAGE_TAG

    - name: Update image tag in deployment manifest
      run: |
        sed -i "s|image: myapp:.*|image: $IMAGE_TAG|g" kubernetes/deployment.yaml

    - name: Ensure namespaces exist
      # ↑ fixed: namespaces must exist before applying to them
      run: kubectl apply -f kubernetes/namespaces.yaml

    - name: Apply ConfigMap
      run: kubectl apply -f kubernetes/configmap.yaml -n $NAMESPACE

    - name: Apply Service
      # ↑ fixed: added -n $NAMESPACE
      run: kubectl apply -f kubernetes/service.yaml -n $NAMESPACE

    - name: Rolling deploy
      run: |
        # Replace IMAGE_TAG placeholder in manifest
        sed -i "s|image: myapp:IMAGE_TAG|image: myapp:${{ github.sha }}|g" \
          kubernetes/deployment.yaml

        kubectl apply -f kubernetes/deployment.yaml

        # This BLOCKS until rollout is complete (or times out)
        # If any pod fails readiness probe, this exits non-zero
        # which triggers the rollback step below
        kubectl rollout status deployment/myapp --timeout=180s

    - name: Rollback if failed
      if: failure()
      run: |
        echo "Rolling update failed — rolling back"
        kubectl rollout undo deployment/myapp
        kubectl rollout status deployment/myapp --timeout=60s

    - name: Smoke test
      run: |
        MINIKUBE_IP=$(minikube ip)
        NODE_PORT=$(kubectl get svc myapp-svc -n $NAMESPACE \
          -o jsonpath='{.spec.ports[0].nodePort}')
        curl -f http://$MINIKUBE_IP:$NODE_PORT/health
        echo "Smoke test passed on $NAMESPACE!"

    - name: Generate deployment summary
      if: always()
      run: |
        # Write to GitHub Actions job summary (appears in UI)
        cat >> $GITHUB_STEP_SUMMARY << EOF
        ## Deployment Summary

        | Property | Value |
        |---|---|
        | Status | ${{ job.status }} |
        | Image | myapp:${{ github.sha }} |
        | Commit | ${{ github.sha }} |
        | Branch | ${{ github.ref_name }} |
        | Triggered by | ${{ github.actor }} |
        | Run number | ${{ github.run_number }} |
        EOF
